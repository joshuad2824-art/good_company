<script>
{
const SECTIONS=[
["Warm-Ups",["What's one of your top three movies, and what keeps you coming back to it?","Do you have a favorite color? What do you like about it?","What kind of music do you reach for most, and who does it especially well?","What snack would you be delighted to find waiting for you?","When you go out for breakfast, what are you most likely to order?","What's a smell you never get tired of?","What's a game you're almost always up for playing?","What game brings out your competitive side?","What's a food you're picky about, and how do you like it done?","What's something you collect, even if you never meant to start a collection?","What's a movie or show you put on when you want something familiar?","What's a store you can browse for ages, and what do you always look at?","What's a small gift you've actually used a lot?","What do you always carry with you?","What's your most harmless pet peeve?","Early bird or night owl, and what's your evidence?","Would you rather talk to animals or speak every language?","What kind of weather changes what you feel like doing?","What's something you'd happily do for an afternoon if someone invited you?","What kind of outing would you happily do again next weekend?"]],
["Just for Fun",["If there were a movie about your life right now, which actor would play you, and why?","If you were a superhero, what would your name and three superpowers be?","If your life right now were a book, what would the title be?","If you had to have an exotic animal as a pet, what would it be?","If there were a contest for something you do every day, could you win it?","If you had to give a ten-minute talk with no time to prepare, what would you talk about?","If you could witness one moment in history, which would it be?","If someone from 100 years ago showed up, what would confuse them the most?","What will a museum 1,000 years from now get hilariously wrong about us?","What would a very polite dragon be surprisingly good at?","What enormous thing would you shrink so you could carry it in your pocket?","What tiny everyday victory deserves its own ridiculous trophy?","What harmless everyday task would make a surprisingly good spectator sport?","If you ran a tiny festival devoted to one ordinary thing, what would people do there?","What sound should announce the arrival of a really good idea?","If you could write one message across the sky for a day, what would it say?","What object would make an excellent mascot for a club with no purpose?","Which mundane chore deserves a dramatic theme song?","If you invented a holiday that lasted only fifteen minutes, how would people celebrate?","What ordinary object would you like to hear narrate one day of its life?","What could a vending machine dispense that would make people stop and smile?","If you could add one unnecessary but delightful feature to a door, what would it do?"]],
["Everyday Delights",["What ordinary thing would be fascinating if you were seeing it for the first time?","What do you tend to notice first when you walk into a room?","What's something you enjoy watching someone do skillfully?","Which part of an ordinary day has surprisingly good scenery?","What's something so well designed you never think about it?","What's an example of something useful that's also beautiful?","Which texture makes something especially satisfying to use?","What's something you like better when it's a little imperfect?","What do you like simple, and what do you enjoy with lots of detail?","Which everyday item are you unusually particular about?","What's an acquired taste you've never managed to acquire?","What's something you enjoy without needing to know much about it?","Describe your perfect cozy evening.","What's something whose appeal is hard to explain until someone tries it?","What do you buy the fancy version of, even though the cheap one works fine?","What's the best thing you tried because someone wouldn't stop talking about it?","What dish do you order to judge whether a new restaurant is any good?","What everyday sound would be hardest to guess if you couldn't see what made it?","What's something that feels modern but has actually been around a long time?","What kind of mess is a sign that something good is happening?","What's an inconvenience that occasionally has a useful side?"]],
["Time Well Spent",["What small ritual gives an ordinary activity a sense of occasion?","What kind of activity makes you lose track of the clock?","What's a good use of ten unexpected free minutes?","What part of getting ready for something can be as fun as the thing itself?","What would you like to do more often, but in smaller amounts?","What's something you'd rather finish in one sitting than come back to later?","What do you enjoy returning to after leaving it alone for a while?","What's worth waiting for, even when the wait is part of the fun?","What would you keep doing by hand even if a machine could do it instantly?","What would you like to try once, without turning it into a new hobby?","What's a small experiment you could try without knowing how it'll turn out?","What would make a familiar activity feel new again?","What would you put in a time capsule of ordinary life that people might otherwise forget?"]],
["Made & Fixed",["What everyday object would you redesign, and what would you change first?","What would you name a tool that solves one of your most minor annoyances?","What's worth repairing even when replacing it would be easier?","What would you enjoy making if the materials were already laid out for you?","What familiar object could become a good game piece?","What object would be interesting to build using only paper?","What's something you see differently after trying to make or repair it yourself?","When did you find a new use for something you already had?","What familiar object has a feature you only recently understood?","What object has a story that's more interesting than its appearance?"]],
["Places & Getting Around",["Where's your favorite place in the world, and why?","What small detail makes an unfamiliar place feel welcoming?","Where could you happily sit for hours?","What's a good way to get acquainted with somewhere new?","What would make a waiting room a genuinely pleasant place to spend twenty minutes?","What local shop would you hate to see close?","What would you like to borrow from a library besides books?","What kind of place looks especially different at another time of day?","What would you put on a map that ordinary maps usually leave out?","What's a local place you'd take a friend who'd never been here?","What's the best thing you discovered by accidentally taking a wrong turn?","What's a small adventure that needed no elaborate planning?","If a familiar place became a miniature model, which detail would be essential?"]],
["Learning & Play",["When did someone explain something in a way that finally made it click?","When did something take much more practice than you expected?","When did you surprise yourself with something you made or figured out?","When did a tiny change make a surprisingly big difference to a task?","What's a small mystery you eventually figured out?","What's a useful thing you learned outside a classroom?","What seems simple until you try to explain it to someone?","What would you like to understand well enough to explain with a drawing?","What activity is more fun when nobody's particularly good at it?","What's an example of a rule that makes a game more fun rather than less?","Which subject gets more interesting when someone tells its history?","What question about the natural world keeps coming back to you?","What would you like a behind-the-scenes tour of?","What subject could you happily hear an enthusiast explain, even if you never take it up?"]],
["Stories & Memories",["What's a memory from your childhood you never want to forget?","What did you want to be when you were growing up, and why?","What's something you loved to do as a kid that you don't do anymore, and why?","What experiences did you have as a child that you wish others could have too?","What place from your past would you love to walk through one more time?","What was your first job, and what did it teach you?","What was the first thing you bought with your own money?","What's a song that takes you straight back to a specific moment?","What's a time you laughed so hard you couldn't stop?","What's the worst haircut you've ever had, and who's to blame?","What's the most ridiculous thing you've been talked into?","What's the funniest thing a kid has ever said to you?","What's something you misunderstood for way too long?","What's the best mistake you ever made?","When did you feel completely out of your depth, and how did it turn out?","When did a plan fall through and the backup turned out better?","What have you noticed only because you were stuck waiting?","What's the best conversation you've ever had with a stranger?","What's a great memory that cost almost nothing?","What's the best day you can remember from this past year?","What was the best gift you ever received, and why?"]],
["People Who Shaped You",["Who's been your greatest teacher, and why?","What's the wisest thing anyone ever told you?","Who taught you to do something you still do their way?","When did a stranger's kindness stay with you?","When did someone go the extra mile for you?","When have you felt truly welcomed somewhere?","What's a compliment you still remember years later?","When did someone close to you surprise you in the best way?","What was the last kind thing you did for someone?","What do you love most about your people, whether family, friends, or both?"]],
["Home & Table",["When you think of home, what image comes to mind?","What dish would you bring to a potluck to become famous for?","What's a family saying outsiders wouldn't understand?","What's a holiday tradition you'd defend to the end?","What do you own that's worth nothing but you'd never give away?"]],
["Going Deeper",["What do you love about how you spend your days?","What are you most excited about in life right now?","What's one thing you really want to experience, and why?","What's a dream of yours that you're still pursuing?","Describe your proudest moment.","What's a risk you're glad you took?","What's a small decision that ended up changing a lot?","What's something you're better at now than you were five years ago?","What's something you've changed your mind about as you've gotten older?","What season of life do you look back on fondly, and what made it good?","If you could relive one ordinary day from your past, which would you pick?","What would your ten-year-old self be most surprised by?","What advice would you give someone a few years behind you?","Who's someone you'd like to be more like, and in what way?","What's a small thing that makes you feel most like yourself?","What do you hope never changes about you?","What's a question you wish people asked you more?","When have you felt most at peace?"]],
["This Group",["If this group had a sitcom, what would it be called?","What's something this group could make together in half an hour?","What's a tradition this group could start without needing a special date?"]]
];
const WILD=[["Everyone answers.","Go around the whole group on the next prompt."],["Lightning round.","Draw the next prompt. Everyone answers in one word."],["Follow-up.","Ask the person who just answered one more question about their answer."],["Swap.","Trade this card for a new one."]];
const THANKS=["What's something small from this year you're thankful for?","Who's someone who made your year better, maybe without even knowing it?","Which Thanksgiving dish could you skip, and which one is non-negotiable?","What's a Thanksgiving memory that still makes you laugh?","What's something you're thankful for that you didn't have a year ago?","What's an everyday thing you'd miss most if it disappeared tomorrow?","What's a lesson from this year you're grateful you learned?","What's the best thing anyone's ever brought to a holiday table?","Who deserves a thank-you from you that you haven't quite gotten around to?","If you could add anyone, from any time in history, to this table, who would it be?"];

const curly=s=>s.replace(/'/g,"’");
const DEPTH={"Learning & Play":"story","Stories & Memories":"story","People Who Shaped You":"story","Home & Table":"story","Going Deeper":"deeper","This Group":"group"};
const LEVEL={light:"Light",story:"Story",deeper:"Deeper",group:"Group",wild:"Wild",thanks:"Gratitude"};
const MARK={
  light:'<circle cx="12" cy="6" r="3.2"/>',
  story:'<circle cx="7.5" cy="6" r="3"/><circle cx="16.5" cy="6" r="3"/>',
  deeper:'<circle cx="4" cy="6" r="2.7"/><circle cx="12" cy="6" r="2.7"/><circle cx="20" cy="6" r="2.7"/>',
  group:'<circle cx="12" cy="6" r="3.9" fill="none" stroke="currentColor" stroke-width="1.5"/>',
  wild:'<path d="M12 .4l1.7 3.9 3.9 1.7-3.9 1.7L12 11.6l-1.7-3.9L6.4 6l3.9-1.7z"/>',
  thanks:'<path d="M12 .6c4.4 2.2 4.4 8.6 0 10.8-4.4-2.2-4.4-8.6 0-10.8z"/>'
};
const mark=k=>{const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 24 12");s.setAttribute("class","mark");s.setAttribute("aria-hidden","true");s.innerHTML=MARK[k];return s};

const deck=[];let n=0;
for(const [sec,list] of SECTIONS)for(const q of list)deck.push({sec,q:curly(q),num:String(++n),depth:DEPTH[sec]||"light"});
const PROMPTS=n;
for(const [q,note] of WILD)deck.push({sec:"Wild card",q:curly(q),note:curly(note),wild:true,depth:"wild"});
THANKS.forEach((q,i)=>deck.push({sec:"Thanksgiving",q:curly(q),num:"T"+(i+1),depth:"thanks",thanks:true}));
const KEY="goodcompany.session.v2",PREF="goodcompany.thanks";

const rnd=k=>{const a=new Uint32Array(1);const lim=Math.floor(4294967296/k)*k;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%k};
const shuffle=arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const isWild=i=>!!deck[i].wild;
const fixWild=(a,prevLast)=>{
  if(a.length<3)return a;
  if(isWild(a[0])||(prevLast!=null&&a[0]===prevLast)){const j=1+a.slice(1).findIndex(i=>!isWild(i)&&i!==prevLast);if(j>0)[a[0],a[j]]=[a[j],a[0]]}
  for(let i=1;i<a.length;i++)if(isWild(a[i])&&isWild(a[i-1])){let j,t=0;do{j=rnd(a.length)}while(++t<500&&(isWild(a[j])||j===0||isWild(a[j-1])||(a[j+1]!=null&&isWild(a[j+1]))));[a[i],a[j]]=[a[j],a[i]]}
  return a};

let thanksOn;try{const p=localStorage.getItem(PREF);thanksOn=p==null?new Date().getMonth()===10:p==="1"}catch(e){thanksOn=new Date().getMonth()===10}
const activeIdx=()=>deck.map((_,i)=>i).filter(i=>!deck[i].thanks||thanksOn);
let S={order:[],pos:0,history:[],at:-1};
const newOrder=last=>{S.order=fixWild(shuffle(activeIdx()),last);S.pos=0};
const syncThanks=()=>{
  let rest=S.order.slice(S.pos).filter(i=>!deck[i].thanks);
  if(thanksOn){const seen=new Set(S.order.slice(0,S.pos));for(const i of activeIdx())if(deck[i].thanks&&!seen.has(i))rest.splice(rnd(rest.length+1),0,i)}
  S.order=S.order.slice(0,S.pos).concat(fixWild(rest,S.history[S.history.length-1]));
};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({size:deck.length,...S}))}catch(e){}};
const load=()=>{try{const d=JSON.parse(localStorage.getItem(KEY)||"null");const ok=a=>Array.isArray(a)&&a.every(i=>Number.isInteger(i)&&i>=0&&i<deck.length);
  if(d&&d.size===deck.length&&ok(d.order)&&ok(d.history)&&Number.isInteger(d.pos)&&d.pos>=0&&d.pos<=d.order.length&&Number.isInteger(d.at)&&d.at>=0&&d.at<d.history.length)return{order:d.order,pos:d.pos,history:d.history,at:d.at}}catch(e){}return null};
const restored=load();
if(restored){S=restored;syncThanks()}else newOrder(null);

const $=id=>document.getElementById(id);
const app=document.querySelector(".app"),coach=$("coach"),coachOk=$("coachOk");
const touchUI=matchMedia("(hover: none) and (pointer: coarse)").matches;
if(touchUI)app.classList.add("swipe");
const HINT="goodcompany.swipehint";let hintSeen=false;try{hintSeen=localStorage.getItem(HINT)==="1"}catch(e){}
const maybeCoach=()=>{if(!touchUI||hintSeen)return;hintSeen=true;try{localStorage.setItem(HINT,"1")}catch(e){}setTimeout(()=>{coach.hidden=false;coachOk.focus({preventScroll:true})},450)};
const closeCoach=()=>{coach.hidden=true};
coachOk.addEventListener("click",closeCoach);
coach.addEventListener("click",e=>{if(e.target===coach)closeCoach()});
const stage=$("stage"),card=$("card"),sec=$("sec"),body=$("body"),foot=$("foot"),count=$("count"),prev=$("prev"),next=$("next"),nav=$("nav"),home=$("home");
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const still=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
let mode="home",ghost=null;

const deal=dir=>{
  if(still()||!card.animate)return;
  if(ghost){ghost.remove();ghost=null}
  const g=card.cloneNode(true);g.removeAttribute("id");g.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
  g.classList.add("ghost");g.setAttribute("aria-hidden","true");
  Object.assign(g.style,{left:card.offsetLeft+"px",top:card.offsetTop+"px",width:card.offsetWidth+"px",height:card.offsetHeight+"px"});
  g.dataset.from=card.style.transform||"none";card.style.transform="";
  stage.append(g);ghost=g;return g};
const play=(g,dir)=>{
  if(still()||!card.animate)return;
  const ease="cubic-bezier(.3,.7,.2,1)";
  if(dir>0){
    g&&g.animate([{transform:g.dataset.from,opacity:1},{transform:"translate(-118%,-2%) rotate(-9deg)",opacity:.0}],{duration:420,easing:"cubic-bezier(.5,0,.3,1)",fill:"forwards"}).finished.then(()=>{g.remove();if(ghost===g)ghost=null}).catch(()=>{});
    card.animate([{transform:"translateY(12px) scale(.965) rotate(.8deg)",filter:"brightness(.8)"},{transform:"none",filter:"none"}],{duration:420,easing:ease});
  }else if(dir<0){
    g&&g.animate([{transform:g.dataset.from,opacity:1},{transform:"translateY(14px) scale(.96)",opacity:0}],{duration:300,easing:"ease-in",fill:"forwards"}).finished.then(()=>{g.remove();if(ghost===g)ghost=null}).catch(()=>{});
    card.animate([{transform:"translate(-108%,-2%) rotate(-7deg)"},{transform:"none"}],{duration:440,easing:ease});
  }else{
    g&&g.remove();ghost=null;
    card.animate([{opacity:0},{opacity:1}],{duration:260,easing:"ease-out"});
  }
};

const showHome=()=>{
  const g=deal(0);
  mode="home";app.classList.remove("carding");home.hidden=true;card.classList.remove("wild");card.classList.add("home-card");delete card.dataset.depth;
  sec.replaceChildren(el("span",null,"Welcome"));
  const w=el("div","welcome"),hd=el("div");
  hd.append(el("h1","title","Good Company"),el("p","sub",PROMPTS+" conversation prompts for any table"));
  const ul=el("ul","rules");for(const r of["Pass anytime.","Follow-ups welcome.","No wrong answers."])ul.append(el("li",null,r));
  const lg=el("ul","legend");lg.setAttribute("aria-label","Card colors");
  for(const k of["light","story","deeper","group","wild"].concat(thanksOn?["thanks"]:[])){const li=el("li"),sw=el("span","sw");sw.style.background="var(--"+k+")";sw.append(mark(k));li.append(sw,el("span",null,LEVEL[k]));lg.append(li)}
  const rc=el("div");rc.append(ul,lg);w.append(hd,rc);body.replaceChildren(w);
  const hint=el("span","hint",started()?"You’re "+S.history.length+(S.history.length===1?" card":" cards")+" in":activeIdx().length+" cards");
  const tg=el("button","tg");tg.type="button";tg.setAttribute("role","switch");tg.setAttribute("aria-checked",String(thanksOn));tg.setAttribute("aria-label","Include Thanksgiving cards");tg.append(el("span",null,"Thanksgiving"),el("i"));
  tg.addEventListener("click",()=>{thanksOn=!thanksOn;try{localStorage.setItem(PREF,thanksOn?"1":"0")}catch(e){}syncThanks();save();showHome()});
  foot.replaceChildren(hint,tg);
  if(started()){
    nav.classList.remove("solo");prev.disabled=false;prev.textContent="Reshuffle";prev.setAttribute("aria-label","Reshuffle and start over");
    next.textContent="Jump back in";next.setAttribute("aria-label","Jump back in where you left off");
  }else{
    nav.classList.add("solo");next.textContent="Start";next.setAttribute("aria-label","Start with a random card");
  }
  count.textContent="";play(g,0);
};
const showCard=dir=>{
  const g=deal(dir);
  mode="card";app.classList.add("carding");home.hidden=false;nav.classList.remove("solo");card.classList.remove("home-card");
  const c=deck[S.history[S.at]];
  card.classList.toggle("wild",!!c.wild);card.dataset.depth=c.depth;
  const lvl=el("span","lvl");lvl.append(mark(c.depth));if(!c.wild)lvl.append(el("span",null,LEVEL[c.depth]));
  sec.replaceChildren(el("span",null,c.sec),lvl);
  body.replaceChildren(el("h1","prompt"+(c.q.length>78?" long":""),c.q),el("p","note",c.note||""));
  const idx=el("span","idx");if(c.num){idx.append(el("small",null,"No."),el("b",null,c.num))}
  foot.replaceChildren(el("span"),idx);
  count.textContent=(S.at+1)+" drawn";
  prev.textContent="Back";prev.setAttribute("aria-label","Previous card");prev.disabled=S.at<=0;
  next.textContent="Next card";next.setAttribute("aria-label","Next random card");
  fit();
  play(g,dir);
  maybeCoach();
};
const started=()=>S.history.length>0;
const draw=()=>{if(S.pos>=S.order.length)newOrder(S.history[S.history.length-1]);S.history.push(S.order[S.pos++]);S.at=S.history.length-1};
const goNext=()=>{if(S.at<S.history.length-1)S.at++;else draw();save();showCard(1)};
const goPrev=()=>{if(S.at>0){S.at--;save();showCard(-1)}};
const reshuffle=()=>{S={order:[],pos:0,history:[],at:-1};newOrder(null);draw();save();showCard(1)};

next.addEventListener("click",()=>{if(mode==="card")goNext();else if(started())showCard(0);else{draw();save();showCard(1)}});
prev.addEventListener("click",()=>{if(mode==="card")goPrev();else reshuffle()});
home.addEventListener("click",showHome);
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("button")&&(e.key===" "||e.key==="Enter"))return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();next.click()}
  else if(e.key==="ArrowLeft"&&mode==="card"){e.preventDefault();goPrev()}
  else if(e.key==="Escape"&&mode==="card"){e.preventDefault();showHome()}
});
const pile=$("pile");const syncPile=()=>Object.assign(pile.style,{left:card.offsetLeft+"px",top:card.offsetTop+"px",width:card.offsetWidth+"px",height:card.offsetHeight+"px"});
const pileRO=new ResizeObserver(syncPile);pileRO.observe(card);pileRO.observe(stage);
const fit=()=>{
  if(mode!=="card")return;const h=body.querySelector(".prompt");if(!h)return;
  const ok=()=>body.scrollHeight<=body.clientHeight+1&&h.scrollWidth<=h.clientWidth+1;
  let lo=20,hi=Math.max(24,Math.min(78,body.clientWidth*.145));
  h.style.fontSize=hi+"px";if(ok())return;
  for(let i=0;i<10;i++){const m=(lo+hi)/2;h.style.fontSize=m+"px";if(ok())lo=m;else hi=m}
  h.style.fontSize=Math.floor(lo)+"px"};
const fitRO=new ResizeObserver(()=>fit());fitRO.observe(body);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
let drag=null;
stage.addEventListener("touchstart",e=>{
  if(e.touches.length>1){drag=null;return}
  const t=e.touches[0];drag={x:t.clientX,y:t.clientY,t:performance.now(),dx:0,lock:null};
  if(mode==="card")card.getAnimations().forEach(a=>a.cancel());
},{passive:true});
stage.addEventListener("touchmove",e=>{
  if(!drag)return;const t=e.touches[0],dx=t.clientX-drag.x,dy=t.clientY-drag.y;
  if(!drag.lock&&Math.abs(dx)+Math.abs(dy)>8)drag.lock=Math.abs(dx)>Math.abs(dy)?"x":"y";
  if(drag.lock!=="x")return;
  e.preventDefault();drag.dx=dx;
  if(mode!=="card")return;
  const d=dx>0&&S.at<=0?dx*.25:dx;
  card.style.transform="translateX("+d+"px) rotate("+(d/26)+"deg)";
},{passive:false});
const endDrag=()=>{
  if(!drag)return;const d=drag;drag=null;
  if(d.lock!=="x"){return}
  const v=d.dx/Math.max(1,performance.now()-d.t),go=Math.abs(d.dx)>90||(Math.abs(d.dx)>30&&Math.abs(v)>.45);
  if(mode!=="card"){if(go&&d.dx<0)next.click();return}
  if(go&&d.dx<0){goNext();return}
  if(go&&d.dx>0&&S.at>0){goPrev();return}
  const from=card.style.transform;card.style.transform="";
  if(from&&card.animate&&!still())card.animate([{transform:from},{transform:"none"}],{duration:320,easing:"cubic-bezier(.3,1.35,.5,1)"});
};
stage.addEventListener("touchend",endDrag,{passive:true});
stage.addEventListener("touchcancel",endDrag,{passive:true});
document.addEventListener("gesturestart",e=>e.preventDefault());
showHome();
}
</script>
</body>
</html>
